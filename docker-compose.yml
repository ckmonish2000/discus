services:
  api:
    build:
      context: .
      dockerfile: infra/docker/dockerfile
    ports:
      - 8000:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.local
    volumes:
      - .:/app
      
  minio:
    image: minio/minio
    ports:
      - 9000:9000
      - 9001:9001
    env_file:
      - .env.local
    command: server /data --console-address ":9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env.local
    volumes:
      - ./scripts/init-minio.sh:/init-minio.sh
    entrypoint: /bin/sh
    command: -c "/init-minio.sh"

volumes:
  storage_data:
