services:

  api:
    build:
      context: .
      dockerfile: infra/docker/api-server.dockerfile
    ports:
      - 8000:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.local
    volumes:
      - .:/app
      # node_modules stays the image's own. The bind mount above would
      # otherwise overlay the host's macOS tree, where native packages like
      # @firecrawl/anydoc resolved to darwin-arm64 binaries this container
      # cannot load.
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.dockerfile
    env_file:
      - .env.local
    volumes:
      - .:/app
      # node_modules stays the image's own. The bind mount above would
      # otherwise overlay the host's macOS tree, where native packages like
      # @firecrawl/anydoc resolved to darwin-arm64 binaries this container
      # cannot load.
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.dockerfile
    ports:
      - 5173:5173
    env_file:
      - .env.local
    environment:
      # Resolved by the browser, not by this container, so it is the host's
      # published API port rather than the compose service name.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      - api

  minio:
    image: minio/minio
    env_file:
      - .env.local
    ports:
      # Direct host access for tests and native processes. Caddy already
      # fronts 9000/9001, so this uses 9002 to avoid colliding with it.
      - 9002:9000
    command: server /data --console-address ":9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env.local
    volumes:
      - ./scripts/init-minio.sh:/init-minio.sh
    entrypoint: /bin/sh
    command: -c "/init-minio.sh"

  ffmpeg:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: discus-ffmpeg
    volumes:
      - ./input:/input
      - ./output:/output
    entrypoint: ["sh"]
    tty: true

  db:
    image: postgres:16-alpine
    container_name: discus-db
    ports:
      # 5433 on the host: 5432 is commonly taken by another local postgres.
      # Inside the compose network the port is still 5432.
      - 5433:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: discus-redis
    ports:
      - 6377:6379
    volumes:
      - redis_data:/data
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - 80:80
      - 443:443
      - 9001:9001
      - 9000:9000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  storage_data:
  db_data:
    driver: local
  redis_data:
    driver: local
  caddy-data:
  caddy-config:
