services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api-server.dockerfile
    ports:
      - 8000:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.local
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.dockerfile
    env_file:
      - .env.local
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy  
  minio:
    image: minio/minio
    ports:
      - 9000:9000
      - 9001:9001
    env_file:
      - .env.local
    command: server /data --console-address ":9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env.local
    volumes:
      - ./scripts/init-minio.sh:/init-minio.sh
    entrypoint: /bin/sh
    command: -c "/init-minio.sh"

  ffmpeg:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: discus-ffmpeg
    volumes:
      - ./input:/input
      - ./output:/output
    entrypoint: ["sh"]
    tty: true
  
  redis:
    image: redis:alpine
    container_name: discus-redis
    ports:
      - 6377:6379
    volumes:
      - redis_data:/data
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  storage_data:
  redis_data:
    driver: local
